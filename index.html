<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Direção Clínica - HU</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        #conteudo-protegido { display: none; }
        #tela-bloqueio {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .btn-acesso {
            padding: 12px 24px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }

        :root {
            --col-ocupacao: #0d9488;
            --col-permanencia: #ea580c;
            --col-giro: #0284c7;
            --col-absorcao: #16a34a;
            --col-conversao: #475569;
            --col-reinternacao: #7c3aed;
            --bg-body: #f1f5f9;
            --text-main: #1e293b;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
        }

        .nav-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 10px 20px;
            background: white;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
        }

        .nav-tab.active {
            background: #1e293b;
            color: white;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
        }

        .col-12 { grid-column: span 12; }
        .col-8  { grid-column: span 8; }
        .col-4  { grid-column: span 4; }

        .card-title {
            font-weight: 600;
            margin-bottom: 16px;
            color: #475569;
        }

        .footer-credits {
            margin-top: 30px;
            text-align: right;
            font-size: 0.65rem;
            color: #94a3b8;
        }
    </style>

    <script>
        const SENHA_CORRETA = "";
        function validarAcesso() {
            document.getElementById('tela-bloqueio').style.display = 'none';
            document.getElementById('conteudo-protegido').style.display = 'block';
            renderDashboard();
        }
        window.onload = validarAcesso;
    </script>
</head>

<body>

<div id="tela-bloqueio">
    <div style="font-size:40px;">🔒</div>
    <h2>Acesso Restrito</h2>
    <button class="btn-acesso" onclick="validarAcesso()">Acessar</button>
</div>

<div id="conteudo-protegido">

    <div class="header">
        <h1>Indicadores Estratégicos HU</h1>
        <div>Última atualização</div>
    </div>

    <div class="nav-container">
        <button class="nav-tab active" onclick="changeTab('ocupacao')">Taxa de Ocupação</button>
        <button class="nav-tab" onclick="changeTab('permanencia')">Permanência</button>
        <button class="nav-tab" onclick="changeTab('giro')">Giro de Leito</button>
        <button class="nav-tab" onclick="changeTab('absorcao')">Absorção Cirúrgica</button>
        <button class="nav-tab" onclick="changeTab('conversao')">Conversão PS</button>
        <button class="nav-tab" onclick="changeTab('reinternacao')">Reinternação</button>
    </div>

    <div id="render-area" class="dashboard-grid"></div>

    <div class="footer-credits">
        Beatryz Rodrigues – Analista Administrativo GEASI
    </div>

</div>

<script>
    let activeTab = 'ocupacao';

    const DB = {
        ocupacao: {},
        permanencia: {},
        giro: {},
        absorcao: {},
        conversao: {},
        reinternacao: {}
    };

    function changeTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderDashboard();
    }

    function renderDashboard() {
        const area = document.getElementById('render-area');
        area.innerHTML = `
            <div class="card col-8">
                <div class="card-title">Evolução Temporal</div>
                <div style="height:300px;"></div>
            </div>

            <div class="card col-4">
                <div class="card-title">Indicador Principal</div>
                <div style="height:300px;"></div>
            </div>

            <div class="card col-12">
                <div class="card-title">Performance por Unidade</div>
                <div style="height:350px;"></div>
            </div>
        `;
    }
</script>

</body>
</html>
